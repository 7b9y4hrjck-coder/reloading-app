<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>Projectiles</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{padding:18px 4px 12px}h1{margin:0;font-size:28px}.sub{color:#9da5b1;font-size:13px;margin-top:4px}.search,select{width:100%;background:#171a20;color:#f4f5f7;border:1px solid #2a2f37;border-radius:12px;padding:12px;font-size:15px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.sortrow{display:flex;align-items:center;justify-content:space-between;color:#9da5b1;font-size:13px;margin:12px 2px}.sortrow select{width:auto}.card,.detailbox{background:#15181d;border:1px solid #2a2f37;border-radius:16px;padding:15px;margin:9px 0}.card:active{background:#1b1f25}.maker{color:#9da5b1;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.name{font-size:18px;font-weight:700;margin:5px 0}.meta,.bc{font-size:13px;color:#c7ccd4}.price{margin-top:9px;font-size:13px}.price b{font-size:15px}.back{background:none;border:0;color:#e4e7eb;font-size:15px;padding:12px 0}.detail{display:none}.detail h2{font-size:25px;margin:5px 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.label{font-size:11px;color:#9da5b1;text-transform:uppercase}.value{font-size:16px;margin-top:3px}.section{border-top:1px solid #2a2f37;margin-top:16px;padding-top:16px}details{margin-top:10px;border:1px solid #2a2f37;border-radius:12px;padding:11px}.ret{display:flex;justify-content:space-between;border-top:1px solid #2a2f37;padding:11px 0;color:#d8dce2}.empty{text-align:center;color:#9da5b1;padding:40px}</style></head><body><div class="app"><section id="list"><header><h1>Projectiles</h1><div class="sub">Reloading component database</div></header><input id="q" class="search" placeholder="Search projectile, SKU, manufacturer…"><div class="filters"><select id="cal"><option value="">All Calibers</option></select><select id="man"><option value="">All Manufacturers</option></select><select id="wt"><option value="">All Weights</option></select><select id="typ"><option value="">All Types</option></select></div><div class="sortrow">Sort results<select id="sort"><option value="man">Manufacturer A–Z</option><option value="name">Product Name A–Z</option><option value="wt">Weight</option><option value="cost">Lowest Verified Cost</option><option value="bc">G1 BC</option></select></div><div id="results"></div></section><section id="detail" class="detail"><button class="back" id="back">‹ Projectiles</button><div class="detailbox" id="detailBox"></div></section></div><script>const data=[['Hornady','75 gr ELD Match','22791','.224',75,'Match','.224',1.105,.467,.235,.31],['Sierra','69 gr MatchKing','1380','.224',69,'Match','.224',1.03,.301,null,.29],['Berger','77 gr OTM Tactical','22101','.224',77,'Match','.224',1.09,.374,.192,.36],['Barnes','55 gr TSX','30193','.224',55,'Hunting','.224',.84,.255,null,.41],['Hornady','108 gr ELD Match','24520','6mm',108,'Match','.243',1.245,.536,.270,.42],['Sierra','107 gr MatchKing','1570','6mm',107,'Match','.243',1.18,.547,.281,.39],['Hornady','140 gr ELD Match','26331','6.5mm',140,'Match','.264',1.39,.610,.315,.45],['Berger','140 gr Hybrid Target','26414','6.5mm',140,'Match','.264',1.365,.600,.310,.47],['Barnes','150 gr TTSX','30364','.308',150,'Hunting','.308',1.27,.450,null,.52],['Sierra','175 gr MatchKing','2275','.308',175,'Match','.308',1.24,.496,.250,.49]].map((x,i)=>({id:i+1,m:x[0],name:x[1],sku:x[2],cal:x[3],wt:x[4],type:x[5],dia:x[6],len:x[7],g1:x[8],g7:x[9],cost:x[10]}));let state={cal:'',man:'',wt:'',typ:'',sort:'man',q:'',scroll:0};const $=x=>document.getElementById(x);function fill(id,vals){vals.forEach(v=>$(id).insertAdjacentHTML('beforeend',`<option>${v}</option>`))}fill('cal',[...new Set(data.map(x=>x.cal))]);fill('man',[...new Set(data.map(x=>x.m))].sort());fill('wt',[...new Set(data.map(x=>x.wt))].sort((a,b)=>a-b));fill('typ',[...new Set(data.map(x=>x.type))]);['cal','man','wt','typ','sort'].forEach(id=>$(id).onchange=()=>{state[id==='cal'?'cal':id==='man'?'man':id==='wt'?'wt':id==='typ'?'typ':'sort']=$(id).value;render()});$('q').oninput=e=>{state.q=e.target.value.toLowerCase();render()};function filtered(){return data.filter(x=>(!state.cal||x.cal===state.cal)&&(!state.man||x.m===state.man)&&(!state.wt||String(x.wt)===state.wt)&&(!state.typ||x.type===state.typ)&&(!state.q||`${x.m} ${x.name} ${x.sku} ${x.cal} ${x.type}`.toLowerCase().includes(state.q))).sort((a,b)=>state.sort==='man'?a.m.localeCompare(b.m)||a.name.localeCompare(b.name):state.sort==='name'?a.name.localeCompare(b.name):state.sort==='wt'?a.wt-b.wt:state.sort==='cost'?a.cost-b.cost:b.g1-a.g1)}function render(){let a=filtered();$('results').innerHTML=a.length?a.map(x=>`<article class="card" onclick="openDetail(${x.id})"><div class="maker">${x.m}</div><div class="name">${x.name}</div><div class="meta">${x.cal} • ${x.wt} gr • ${x.type}</div><div class="bc">G1: ${x.g1} &nbsp; G7: ${x.g7??'—'}</div><div class="price">Lowest verified: <b>$${x.cost.toFixed(2)}/round</b></div></article>`).join(''):'<div class="empty">No projectiles match.</div>'}function openDetail(id){let x=data.find(v=>v.id===id);state.scroll=scrollY;$('list').style.display='none';$('detail').style.display='block';scrollTo(0,0);$('detailBox').innerHTML=`<div class="maker">${x.m}</div><h2>${x.name}</h2><div class="grid"><div><div class="label">Caliber</div><div class="value">${x.cal}</div></div><div><div class="label">Weight</div><div class="value">${x.wt} gr</div></div><div><div class="label">Diameter</div><div class="value">${x.dia}</div></div><div><div class="label">Length</div><div class="value">${x.len.toFixed(3)} in</div></div><div><div class="label">Manufacturer #</div><div class="value">${x.sku}</div></div><div><div class="label">Manufacturer Type</div><div class="value">${x.type}</div></div></div><div class="section"><div class="label">Ballistic Coefficient</div><div class="value">G1: ${x.g1} &nbsp;&nbsp; G7: ${x.g7??'—'}</div><details><summary>Additional BC Information</summary><p>Prototype record. Verify against current manufacturer documentation before production use.</p></details></div><div class="section"><div class="label">Lowest Verified Cost/Round</div><div class="value">$${x.cost.toFixed(2)}</div><div style="margin-top:10px"><div class="ret"><span>Verified retailer</span><span>$${x.cost.toFixed(2)}/round</span></div></div></div>`}$('back').onclick=()=>{$('detail').style.display='none';$('list').style.display='block';scrollTo(0,state.scroll)};render();</script></body></html>
